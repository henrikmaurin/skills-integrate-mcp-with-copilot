<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="school-heading">
        <h1>Mergington High School</h1>
        <h2>Extracurricular Activities</h2>
      </div>
      <div class="user-menu">
        <button
          id="login-toggle"
          class="user-menu-button"
          type="button"
          aria-label="Teacher login"
          aria-expanded="false"
          aria-controls="login-form"
        >
          <span aria-hidden="true">&#128100;</span>
          <span id="user-menu-label">Teacher login</span>
        </button>
        <span id="teacher-status" class="hidden"></span>
        <form id="login-form" class="login-form hidden">
          <div class="form-group">
            <label for="username">Teacher username:</label>
            <input id="username" name="username" autocomplete="username" required />
          </div>
          <div class="form-group">
            <label for="password">Password:</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <button type="submit">Log in</button>
        </form>
        <button id="logout-button" class="hidden" type="button">Log out</button>
      </div>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container" class="hidden">
        <h3>Manage Activity Registrations</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
      </section>
    </main>

    <div id="message" class="hidden" role="status" aria-live="polite"></div>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
